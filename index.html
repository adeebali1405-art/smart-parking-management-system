<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ParkGrid – Smart Parking Management By M.Adeeb Ali Full Stack Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7e9ea;--surface:#f7f8f8;--ink:#1a1e22;--muted:#5a636b;--line:#c5cbd0;
  --asphalt:#2b3036;--paint:#f2f4f5;--free:#1c8a5a;--busy:#c9432e;--hold:#e0a912;--ev:#2a62c8;--accent:#1a1e22;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow",system-ui,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121518;--surface:#1b1f23;--ink:#eceff1;--muted:#99a3ab;--line:#2e343a;--asphalt:#23282d;--accent:#eceff1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121518;--surface:#1b1f23;--ink:#eceff1;--muted:#99a3ab;--line:#2e343a;--asphalt:#23282d;--accent:#eceff1;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ev);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:1rem clamp(.75rem,3vw,2rem) 3rem}
header{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;justify-content:space-between;padding:.5rem 0 1.25rem}
.brand h1{font:700 2rem/1 var(--display);letter-spacing:.01em;margin:0}
.brand p{margin:.2rem 0 0;color:var(--muted);font-size:.9rem}
.tools{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.clock{font:600 1.25rem var(--display);font-variant-numeric:tabular-nums;padding-right:.4rem}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:6px;padding:.5rem .9rem;font-weight:600;cursor:pointer;min-height:40px}
.btn:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.btn.primary{background:var(--accent);color:var(--bg)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 85%,var(--bg))}
.btn.danger{border-color:var(--busy);color:var(--busy)}
.btn[aria-pressed="true"]{background:var(--free);border-color:var(--free);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:1.25rem}
.stat{background:var(--surface);padding:.9rem 1.1rem}
.stat b{display:block;font:700 2.4rem/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.9rem}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:1.25rem;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
.bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:.75rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:6px;padding:.4rem .8rem;cursor:pointer;text-align:left;min-width:108px}
.tab[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 -4px 0 var(--ink)}
.tab strong{font:700 1.15rem var(--display);display:block}
.tab small{color:var(--muted)}
.search{margin-left:auto;display:flex;gap:.4rem}
input,select{background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:.5rem .7rem;min-height:40px;width:100%}
.search input{width:190px}
.lot{background:var(--asphalt);border-radius:10px;padding:1.1rem;color:var(--paint)}
.lot-head{display:flex;justify-content:space-between;font:600 .95rem var(--display);letter-spacing:.06em;color:#aeb7be;margin-bottom:.8rem}
.bays{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:.55rem}
.bay{position:relative;aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:space-between;padding:.45rem .5rem;border:2px solid rgba(242,244,245,.55);border-bottom-color:transparent;border-radius:3px 3px 0 0;background:transparent;color:var(--paint);text-align:left;cursor:pointer;transition:background .2s,transform .15s}
.bay:hover{background:rgba(255,255,255,.08)}
.bay .id{font:700 1.05rem var(--display)}
.bay .tag{font-size:.7rem;font-weight:600;opacity:.85}
.bay .plate{font:600 .85rem var(--display);letter-spacing:.04em;background:var(--paint);color:#1a1e22;border-radius:3px;padding:0 .3rem;align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bay .meta{font-size:.72rem;opacity:.9}
.bay.occupied{background:color-mix(in srgb,var(--busy) 55%,transparent);border-color:var(--busy)}
.bay.reserved{background:repeating-linear-gradient(135deg,rgba(224,169,18,.35) 0 8px,transparent 8px 16px);border:2px dashed var(--hold)}
.bay.free .tag.st{color:#7be0b0}
.bay.type-ev:not(.occupied)::after,.bay.type-acc:not(.occupied)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--ev)}
.bay.type-acc:not(.occupied)::after{background:#3aa0e8}
.bay.hit{outline:3px solid var(--hold);outline-offset:2px;animation:pulse 1s 3}
@keyframes pulse{50%{transform:scale(1.04)}}
.legend{display:flex;flex-wrap:wrap;gap:1rem;margin-top:.9rem;font-size:.85rem;color:#c3cbd1}
.legend i{display:inline-block;width:14px;height:14px;border-radius:2px;margin-right:.35rem;vertical-align:-2px;border:2px solid rgba(242,244,245,.6)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1rem 1.1rem;margin-bottom:1rem}
.card h2{font:700 1.3rem var(--display);margin:0 0 .7rem}
.field{margin-bottom:.7rem}
.field label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.25rem}
.check{display:flex;gap:.5rem;align-items:center;font-size:.9rem;margin:.2rem 0 .8rem}
.check input{width:auto;min-height:0}
.tariff{width:100%;border-collapse:collapse;font-size:.92rem}
.tariff td{padding:.3rem 0;border-bottom:1px solid var(--line)}
.tariff td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.log{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto;font-size:.88rem}
.log li{padding:.4rem 0;border-bottom:1px solid var(--line);display:flex;gap:.6rem}
.log time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.empty{color:var(--muted);font-size:.9rem}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:1.3rem;width:min(420px,calc(100vw - 1.5rem))}
dialog::backdrop{background:rgba(10,12,14,.6)}
dialog h3{font:700 1.7rem var(--display);margin:0}
dialog .sub{color:var(--muted);margin:0 0 1rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.3rem 1rem;margin:0 0 1rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;text-align:right}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}.row .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:.65rem 1.1rem;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1>ParkGrid By M.Adeeb Ali Full Stack Developer</h1><p>Smart parking and slot management</p></div>
    <div class="tools">
      <span class="clock" id="clock" aria-label="Current time"></span>
      <button class="btn" id="sim" aria-pressed="false">Simulate traffic</button>
      <button class="btn danger" id="reset">Reset lot</button>
    </div>
  </header>

  <section class="stats" id="stats" aria-label="Live statistics"></section>

  <div class="layout">
    <main>
      <div class="bar">
        <div class="tabs" id="tabs" role="tablist" aria-label="Floors"></div>
        <form class="search" id="find" role="search">
          <input id="q" type="search" placeholder="Find a plate" aria-label="Find a vehicle by plate" autocomplete="off">
          <button class="btn" type="submit">Find</button>
        </form>
      </div>
      <section class="lot" aria-label="Parking floor map">
        <div class="lot-head"><span id="floorName"></span><span>ENTRY / EXIT: SOUTH GATE</span></div>
        <div class="bays" id="bays"></div>
        <div class="legend">
          <span><i></i>Free</span>
          <span><i style="background:rgba(201,67,46,.7);border-color:#c9432e"></i>Occupied</span>
          <span><i style="border-style:dashed;border-color:#e0a912"></i>Reserved</span>
          <span><i style="border-bottom:5px solid #2a62c8"></i>EV charging</span>
          <span><i style="border-bottom:5px solid #3aa0e8"></i>Accessible</span>
        </div>
      </section>
    </main>

    <aside>
      <section class="card">
        <h2>Check in a vehicle</h2>
        <form id="checkin">
          <div class="field"><label for="plate">Plate number</label><input id="plate" required maxlength="10" placeholder="e.g. BKL-482" autocomplete="off"></div>
          <div class="field"><label for="vt">Vehicle type</label>
            <select id="vt"><option value="car">Car</option><option value="ev">Electric vehicle</option><option value="bike">Motorbike</option></select></div>
          <label class="check"><input type="checkbox" id="acc"> Needs an accessible bay</label>
          <button class="btn primary" style="width:100%" type="submit">Assign nearest bay</button>
        </form>
      </section>
      <section class="card">
        <h2>Tariff</h2>
        <table class="tariff" id="tariff"></table>
      </section>
      <section class="card">
        <h2>Activity</h2>
        <ul class="log" id="log"></ul>
      </section>
    </aside>
  </div>
</div>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const KEY = "parkgrid.v1";
const RATE = { car: 100, bike: 50, ev: 150 };
const CAP = 1000, HOLD_MIN = 30;
const NAMES = { car: "Car", bike: "Motorbike", ev: "Electric vehicle" };
const FLOORS = [{ id: "A", name: "Ground floor", ev: 4, acc: 2 }, { id: "B", name: "Level 1", ev: 2, acc: 0 }, { id: "C", name: "Level 2", ev: 0, acc: 0 }];
const PER_FLOOR = 18;
const $ = (s, r = document) => r.querySelector(s);
const money = n => "Rs " + Math.round(n).toLocaleString("en-PK");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clean = s => s.toUpperCase().replace(/[^A-Z0-9-]/g, "");
const hm = t => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const mins = ms => { const m = Math.floor(ms / 60000); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`; };
const fee = (s, now = Date.now()) => Math.min(Math.max(1, Math.ceil((now - s.since) / 3600000)) * RATE[s.vt], CAP);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const plateGen = () => Array.from({ length: 3 }, () => String.fromCharCode(65 + rnd(0, 25))).join("") + "-" + rnd(100, 999);

let S = load(), floor = "A", hit = "";

function seed() {
  const slots = [];
  FLOORS.forEach(f => {
    for (let i = 1; i <= PER_FLOOR; i++) {
      const type = i <= f.ev ? "ev" : i <= f.ev + f.acc ? "acc" : "std";
      const s = { id: f.id + String(i).padStart(2, "0"), floor: f.id, type, status: "free" };
      if (Math.random() < .4) {
        const vt = type === "ev" ? "ev" : Math.random() < .15 ? "bike" : "car";
        Object.assign(s, { status: "occupied", plate: plateGen(), vt, since: Date.now() - rnd(8, 280) * 60000 });
      }
      slots.push(s);
    }
  });
  return { slots, log: [{ t: Date.now(), m: "Lot opened for the day" }], revenue: 0, sessions: 0 };
}
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s?.slots?.length) return s; } catch {} return seed(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
function log(m) { S.log.unshift({ t: Date.now(), m }); S.log.length = Math.min(S.log.length, 40); }

let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2800); }

/* ---------- domain ---------- */
const findPlate = p => S.slots.find(s => s.status === "occupied" && s.plate === p);
function pick(plate, vt, acc) {
  const held = S.slots.find(s => s.status === "reserved" && s.plate === plate);
  if (held) return held;
  const free = S.slots.filter(s => s.status === "free");
  const order = acc ? ["acc"] : vt === "ev" ? ["ev", "std"] : ["std"];
  for (const t of order) { const m = free.find(s => s.type === t); if (m) return m; }
  return null;
}
function park(slot, plate, vt) {
  if (findPlate(plate)) return toast(`${plate} is already parked`), false;
  if (slot.type === "ev" && vt !== "ev") return toast("EV bays are for electric vehicles"), false;
  Object.assign(slot, { status: "occupied", plate, vt, since: Date.now() });
  delete slot.until;
  log(`${plate} parked in ${slot.id}`); save(); render();
  toast(`${plate} parked in bay ${slot.id}`); return true;
}
function release(slot) {
  const amount = fee(slot), dur = mins(Date.now() - slot.since), plate = slot.plate;
  S.revenue += amount; S.sessions++;
  ["plate", "vt", "since", "until"].forEach(k => delete slot[k]); slot.status = "free";
  log(`${plate} left ${slot.id} after ${dur} – ${money(amount)}`); save(); render();
  toast(`Payment of ${money(amount)} received`);
}
function reserve(slot, plate) {
  if (!plate) return toast("Enter a plate to reserve"), false;
  Object.assign(slot, { status: "reserved", plate, until: Date.now() + HOLD_MIN * 60000 });
  log(`${slot.id} held for ${plate} (${HOLD_MIN} min)`); save(); render();
  toast(`Bay ${slot.id} held for ${HOLD_MIN} minutes`); return true;
}
function cancelHold(slot) { log(`Hold on ${slot.id} released`); ["plate", "until"].forEach(k => delete slot[k]); slot.status = "free"; save(); render(); }
function expire() { S.slots.forEach(s => { if (s.status === "reserved" && s.until < Date.now()) { log(`Hold on ${s.id} expired`); ["plate", "until"].forEach(k => delete s[k]); s.status = "free"; } }); }

/* ---------- render ---------- */
function render() {
  const total = S.slots.length, occ = S.slots.filter(s => s.status === "occupied").length;
  const held = S.slots.filter(s => s.status === "reserved").length, free = total - occ - held;
  $("#stats").innerHTML = [
    [free, "Bays free"], [Math.round((occ + held) / total * 100) + "%", "Lot occupancy"],
    [occ, "Vehicles inside"], [money(S.revenue), `Revenue (${S.sessions} exits)`]
  ].map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");

  $("#tabs").innerHTML = FLOORS.map(f => {
    const fs = S.slots.filter(s => s.floor === f.id), ff = fs.filter(s => s.status === "free").length;
    return `<button class="tab" role="tab" data-f="${f.id}" aria-selected="${f.id === floor}"><strong>${f.name}</strong><small>${ff} of ${fs.length} free</small></button>`;
  }).join("");
  $("#floorName").textContent = FLOORS.find(f => f.id === floor).name.toUpperCase();

  $("#bays").innerHTML = S.slots.filter(s => s.floor === floor).map(s => {
    const tag = s.type === "ev" ? "EV" : s.type === "acc" ? "Accessible" : "";
    const body = s.status === "occupied" ? `<span class="plate">${esc(s.plate)}</span><span class="meta">${mins(Date.now() - s.since)}</span>`
      : s.status === "reserved" ? `<span class="plate">${esc(s.plate)}</span><span class="meta">Held until ${hm(s.until)}</span>`
      : `<span class="tag st">Free</span>`;
    return `<button class="bay ${s.status} type-${s.type}${hit === s.id ? " hit" : ""}" data-id="${s.id}" aria-label="Bay ${s.id}, ${s.status}${s.plate ? ", " + esc(s.plate) : ""}">
      <span><span class="id">${s.id}</span> <span class="tag">${tag}</span></span>${body}</button>`;
  }).join("");

  $("#tariff").innerHTML = Object.keys(RATE).map(k => `<tr><td>${NAMES[k]}</td><td>${money(RATE[k])} / hour</td></tr>`).join("")
    + `<tr><td>Daily maximum</td><td>${money(CAP)}</td></tr><tr><td>Reservation hold</td><td>${HOLD_MIN} min</td></tr>`;

  $("#log").innerHTML = S.log.slice(0, 12).map(l => `<li><time>${hm(l.t)}</time><span>${esc(l.m)}</span></li>`).join("");
}

/* ---------- slot dialog ---------- */
const dlg = $("#dlg");
function openSlot(id) {
  const s = S.slots.find(x => x.id === id), typ = s.type === "ev" ? "EV charging bay" : s.type === "acc" ? "Accessible bay" : "Standard bay";
  let html = `<h3>Bay ${s.id}</h3><p class="sub">${typ}</p>`;
  if (s.status === "occupied") {
    html += `<dl class="kv"><dt>Plate</dt><dd>${esc(s.plate)}</dd><dt>Vehicle</dt><dd>${NAMES[s.vt]}</dd><dt>Arrived</dt><dd>${hm(s.since)}</dd>
      <dt>Parked for</dt><dd>${mins(Date.now() - s.since)}</dd><dt>Fee so far</dt><dd>${money(fee(s))}</dd></dl>
      <div class="row"><button class="btn" data-a="close">Close</button><button class="btn primary" data-a="out">Take payment and release</button></div>`;
  } else if (s.status === "reserved") {
    html += `<dl class="kv"><dt>Held for</dt><dd>${esc(s.plate)}</dd><dt>Hold ends</dt><dd>${hm(s.until)}</dd></dl>
      <div class="row"><button class="btn" data-a="close">Close</button><button class="btn" data-a="cancel">Release hold</button><button class="btn primary" data-a="arrive">Vehicle arrived</button></div>`;
  } else {
    html += `<div class="field"><label for="dp">Plate number</label><input id="dp" maxlength="10" placeholder="e.g. BKL-482" autocomplete="off"></div>
      <div class="field"><label for="dv">Vehicle type</label><select id="dv"><option value="${s.type === "ev" ? "ev" : "car"}">${s.type === "ev" ? "Electric vehicle" : "Car"}</option>${s.type === "ev" ? "" : '<option value="bike">Motorbike</option><option value="ev">Electric vehicle</option>'}</select></div>
      <div class="row"><button class="btn" data-a="close">Close</button><button class="btn" data-a="hold">Hold ${HOLD_MIN} min</button><button class="btn primary" data-a="park">Park here</button></div>`;
  }
  dlg.innerHTML = html; dlg.dataset.id = id;
  dlg.showModal();
}
dlg.addEventListener("click", e => {
  const a = e.target.closest("[data-a]")?.dataset.a; if (!a) return;
  const s = S.slots.find(x => x.id === dlg.dataset.id), p = clean($("#dp")?.value || ""), v = $("#dv")?.value;
  if (a === "close") return dlg.close();
  if (a === "out") release(s);
  else if (a === "cancel") cancelHold(s);
  else if (a === "arrive") park(s, s.plate, "car");
  else if (a === "park") { if (!p) return toast("Enter a plate number"); if (!park(s, p, v)) return; }
  else if (a === "hold") { if (!reserve(s, p)) return; }
  dlg.close();
});

/* ---------- events ---------- */
$("#bays").addEventListener("click", e => { const b = e.target.closest(".bay"); if (b) openSlot(b.dataset.id); });
$("#tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (t) { floor = t.dataset.f; render(); } });
$("#plate").addEventListener("input", e => e.target.value = clean(e.target.value));
$("#checkin").addEventListener("submit", e => {
  e.preventDefault();
  const plate = clean($("#plate").value), vt = $("#vt").value, acc = $("#acc").checked;
  if (!plate) return;
  const slot = pick(plate, vt, acc);
  if (!slot) return toast(acc ? "No accessible bays are free" : "The lot is full");
  if (park(slot, plate, vt)) { floor = slot.floor; hit = slot.id; render(); setTimeout(() => { hit = ""; render(); }, 3200); e.target.reset(); }
});
$("#find").addEventListener("submit", e => {
  e.preventDefault();
  const p = clean($("#q").value); if (!p) return;
  const s = S.slots.find(x => x.plate === p) || S.slots.find(x => x.plate?.includes(p));
  if (!s) return toast(`No vehicle matches ${p}`);
  floor = s.floor; hit = s.id; render(); toast(`${s.plate} is in bay ${s.id}`);
  setTimeout(() => { hit = ""; render(); }, 3200);
});
$("#reset").addEventListener("click", () => { if (confirm("Reset the lot and clear all records?")) { S = seed(); floor = "A"; save(); render(); toast("Lot reset"); } });

/* ---------- traffic simulator ---------- */
let simT = null;
$("#sim").addEventListener("click", e => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", on);
  clearInterval(simT);
  if (on) simT = setInterval(() => {
    const occ = S.slots.filter(s => s.status === "occupied");
    if (Math.random() < .5 && occ.length) { release(occ[rnd(0, occ.length - 1)]); }
    else { const vt = Math.random() < .2 ? "ev" : Math.random() < .15 ? "bike" : "car", p = plateGen(), s = pick(p, vt, false); if (s) park(s, p, vt); }
  }, 2500);
});

/* ---------- clock + housekeeping ---------- */
const tick = () => $("#clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
tick(); setInterval(tick, 1000);
